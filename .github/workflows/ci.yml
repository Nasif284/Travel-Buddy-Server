name: Travel Buddy CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Branch Name
        if: github.event_name == 'pull_request'
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|chore|release)\/[A-Z]+-[0-9]+-[a-z0-9-]+$ ]]; then
            echo "❌ Invalid branch name."
            echo "Expected: feature/TB-123-create-trip"
            exit 1
          fi

      - name: Validate Commit Messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}

          COMMITS=$(git rev-list origin/${{ github.base_ref }}..HEAD)

          for COMMIT in $COMMITS; do
            COMMIT_MSG=$(git log -1 --pretty=%s "$COMMIT")

            echo "Checking commit:"
            echo "$COMMIT_MSG"

            if [[ ! "$COMMIT_MSG" =~ ^(feat|fix|docs|style|refactor|test|chore|build|ci|perf)(\(.+\))?:\ .+ ]]; then
              echo "❌ Invalid commit message:"
              echo "$COMMIT_MSG"
              echo ""
              echo "Example:"
              echo "feat: create trip API"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Code Formatting
        run: npm run format:check

      - name: Lint for Errors
        run: npm run lint

      - name: Type Check (No Emit)
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build
